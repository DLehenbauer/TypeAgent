# This workflow will build and test the TypeAgent Go code.

name: build-go

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  build_go:
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go/taskpilot
    steps:
      - name: Setup Git LF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          filters: |
            go:
              - "go/**"
              - ".github/workflows/build-go.yml"
      - name: Setup Go
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go != 'false' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/taskpilot/go.sum
      - name: Build
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go != 'false' }}
        run: go build ./...
      - name: Test
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go != 'false' }}
        run: go test ./...
